worker_processes auto;
events { worker_connections 1024; }

rtmp_auto_push on;
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;

            # HLS (segmentos de 1s para bajar latencia)
            hls on;
            hls_path /var/data/hls;
            hls_fragment 1s;
            hls_playlist_length 6s;
            hls_nested on;

            # DASH opcional
            dash off;

            # Grabar deshabilitado
            record off;

            # Opcional: clave sencilla (comenta si no querés)
            # on_publish http://localhost:8080/auth; 
        }
    }
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;

    # CORS para .m3u8 y .ts
    map $request_method $cors {
        default 0;
        "~*OPTIONS|GET|HEAD" 1;
    }

    server {
        listen 8080;

        # HLS estático
        location /hls/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            add_header Cache-Control "no-cache";
            if ($cors) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
                add_header Access-Control-Allow-Headers "*";
            }
            root /var/data;
        }

        # Healthcheck simple
        location / {
            return 200 "RTMP/HLS OK\n";
            add_header Content-Type text/plain;
        }
    }
}
