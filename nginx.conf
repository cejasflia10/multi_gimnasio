worker_processes  auto;
events { worker_connections  1024; }

rtmp {
  server {
    listen 1935;                     # Ingreso RTMP desde OBS
    chunk_size 4096;

    application live {
      live on;
      # Grabar opcional (comentalo si no querés archivo .flv)
      # record all;
      # record_path /mnt/hls/records;
      # record_unique on;

      # Transmux a HLS (LL-HLS-style: segmentos cortos)
      hls on;
      hls_path /mnt/hls;
      hls_fragment 1s;               # segmento de 1 segundo
      hls_playlist_length 6s;        # ventana ~6s
      hls_delete_threshold 10;       # limpia viejos
      hls_nested on;
      hls_variant _720p BANDWIDTH=2800000 RESOLUTION=1280x720;
      # Si querés más calidades, podés duplicar variantes con ffmpeg (ABR).
    }
  }
}

http {
  # Para servir HLS (.m3u8 y .ts/.mp4)
  server {
    listen 8080;
    server_name _;

    add_header Access-Control-Allow-Origin * always;
    add_header Cache-Control no-cache;

    location / {
      root /usr/share/nginx/html;
      index index.html;
    }

    # Lista de segmentos HLS
    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
        video/mp4 mp4;
      }
      root /mnt;
      add_header Cache-Control no-cache;
      add_header 'Access-Control-Allow-Origin' '*';
    }
  }
}
